[platformio]
default_envs = deskid

[deskid_common]
; PlatformIO gives project sources the mbedTLS include paths and leaves out the
; configuration ESP-IDF compiles the library with. src/main.cpp puts private
; mbedTLS structures on its stack, so it has to see the same one: with the
; stock configuration mbedtls_hmac_drbg_context is 100 bytes there and 112 in
; the library.
build_flags =
    -DDESKID_USB_VID=0xCAFE
    -DDESKID_USB_PID=0xD15D
    '-DMBEDTLS_CONFIG_FILE="mbedtls/esp_config.h"'
    '-DTF_PSA_CRYPTO_USER_CONFIG_FILE="mbedtls/esp_config.h"'

[env:deskid]
platform = espressif32@7.0.1
board = lolin_s3_mini
framework = espidf
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
upload_speed = 921600
extra_scripts = pre:tools/platformio_pre.py
; DESKID_ALLOW_DOWNLOAD_MODE serves 80 F0 00 00 00 behind the presence gate.
; deskid-production builds from deskid_common so it never inherits the flag.
build_flags =
    ${deskid_common.build_flags}
    -DDESKID_ALLOW_DOWNLOAD_MODE=1

; Bench bring-up only: runs without the R503 wired and approves every
; signature request. Never flash this image on a real token.
[env:deskid-bringup]
extends = env:deskid
build_flags =
    ${env:deskid.build_flags}
    -DDESKID_BRINGUP_NO_SENSOR=1
    -DDESKID_ALLOW_PIV_AID=1

[env:deskid-production]
extends = env:deskid
build_flags =
    ${deskid_common.build_flags}
    -DDESKID_PRODUCTION=1

[env:native]
platform = native
test_build_src = no
build_flags =
    -std=c++17
